<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой сайт</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 50px 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 25px;
      font-size: 60px;
      color: #fff;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #222;
    }

    .subtitle {
      color: #777;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .links a {
      display: block;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      background: #f0f2ff;
      color: #4a5bd4;
    }

    .links a:hover {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 30px;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">👋</div>
    <h1>Привет, мир!</h1>
    <p class="subtitle">Это мой первый сайт на GitHub Pages</p>

    <div class="links">
      <a href="https://github.com" target="_blank">🐙 Мой GitHub</a>
      <a href="https://t.me" target="_blank">✈️ Telegram</a>
      <a href="mailto:example@mail.com">✉️ Написать мне</a>
    </div>

    <footer>© 2026 · Сделано с ❤️</footer>
  </div>
</body>
  </html>
